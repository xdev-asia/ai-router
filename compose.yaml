# Local run of the gateway: `docker compose up --build`, then http://localhost:8787
services:
  ai-router:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
      # Codex sign-in: auth.openai.com sends the browser back to http://localhost:1455/auth/callback.
      - "127.0.0.1:1455:8787"
    volumes:
      - ./.dev.vars:/app/.dev.vars:ro
      # Local D1 (systems, usage, console sessions) survives restarts.
      - state:/app/.wrangler/state
    depends_on:
      - codex-relay
  # chatgpt.com refuses requests from a Worker (Cf-Worker header), so Codex goes through this relay.
  # Reached as http://codex-relay:8790 from ai-router only: no port on the host.
  codex-relay:
    build: ./relay
    env_file: .codex-relay.env
    restart: unless-stopped
volumes:
  state:
