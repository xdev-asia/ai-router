name: ci

# Checks on every PR and push. On main (push or manual run), job image builds the Docker images and pushes them to
# ghcr.io; watchtower on the server pulls them (README.md, On a Mac mini). There is no other deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # @xdev-asia/ui comes from npmjs.com, so the install needs no token.
      - name: Install
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - run: corepack pnpm run typecheck
      - run: corepack pnpm run test
      - run: corepack pnpm run test:web
      - run: node --test relay/test/codex-relay.test.mjs docker/test/docker.test.mjs
      - run: python3 -m unittest discover -s mac

      # Clip Studio (studio/) has its own lockfile, as its image builds from that folder alone. ffmpeg runs the
      # whole render test.
      - name: Studio
        working-directory: studio
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          corepack pnpm install --frozen-lockfile
          corepack pnpm run typecheck
          corepack pnpm run test
      - run: corepack pnpm run build

  # Docker images for compose.yaml, on ghcr.io: `latest` and `sha-<commit>`, for amd64 and arm64.
  image:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ai-router
            context: .
          - image: ai-router-relay
            context: relay
          - image: ai-router-studio
            context: studio
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build the gateway reports on /health and the console compares against (README, Which build is running).
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_BUILT_AT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
