<!doctype html>
<html lang="en" data-ground="navy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!-- Logo v12 flat tile, copied from @xdev-asia/ui/brand/xdev-mark-tile.svg. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before first paint: the choice saved by the theme switch, else the system's.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("ai-router.theme");
        } catch (e) {}
        var light = saved === "light" || (saved !== "dark" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>
    <title>xDev AI Router</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
